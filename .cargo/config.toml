# The kernel is compiled without vector instructions (the Rust UEFI
# target turns them off). Four of the libraries xila-tls rests on would
# otherwise choose them while running, for speed, and do not compile
# there: each is told to use its plain code. On the host, where the unit
# tests run, they choose as they like.
[target.x86_64-unknown-uefi]
rustflags = [
    '--cfg', 'chacha20_backend="soft"',
    '--cfg', 'poly1305_backend="soft"',
    '--cfg', 'sha2_backend="soft"',
    '--cfg', 'curve25519_dalek_backend="serial"',
]

# A unit test makes a whole System on its stack, more than once when a
# helper returns one: 505 KB each, with the room of the virtual machine,
# the names of who called each program, what jobs wait for and the
# panels that are open. The 2 MB a test thread gets by default no longer
# hold that, so the tests are given 8 MB. This says nothing of the
# kernel, whose System is not on a stack: its task stacks are tried by
# tools/check.py.
[env]
RUST_MIN_STACK = "8388608"
