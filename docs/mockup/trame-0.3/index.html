/* Jetons : « aube » par défaut (clair), « nuit » en sombre. Le décor 3D lit les mêmes jetons. */
:root{
  color-scheme: light;
  --scene: day;
  --page:#ffe0a3;
  --sky-top:#fff3c4; --sky-mid-calm:#ffe6b0; --sky-mid-hot:#ffd0a6; --sky-hz-calm:#fff0b8; --sky-hz-hot:#ffa56b;
  --ground:#fbefd2; --grid:#e3b877; --tower-base:#ffffff; --wall:#5a3410; --ink:#2f1a06;
  --h1:#128f84; --h2:#6a4fd0; --h3:#c77700; --h4:#d1366f; --h5:#5a8f14; --h6:#2a73c9;

  --bar-bg:#4a2a0c; --bar-ink:#fff3d1; --bar-icon:#ffcf8a;

  --mesh:rgba(255,246,220,.3); --plate:rgba(255,246,220,.86); --shade:#fffaf0; --tint:#2f1a06;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--page);color:var(--mast-ink);overflow:hidden;
  display:grid;grid-template-rows:auto auto minmax(0,1fr);
  font:21px/1.08 "VT323",ui-monospace,Menlo,Consolas,"Courier New",monospace;letter-spacing:.03em;
}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}

/* Bandeau encadré, avec le trait interrompu en morse */
.mast{background:var(--mast-bg);padding:9px 10px 10px}
.frame{border-left:2px solid var(--mast-line);border-right:2px solid var(--mast-line)}
.edge{display:flex;align-items:center;height:2px}
.edge i{display:block;height:2px;background:var(--mast-line)}
.edge .morse{flex:0 0 56px;background:linear-gradient(90deg,var(--mast-line) 0 20px,transparent 20px 28px,var(--mast-line) 28px 38px,transparent 38px 46px,var(--mast-line) 46px 50px,transparent 50px)}
.edge .morse.rev{transform:scaleX(-1)}
.edge .gap{flex:0 0 30px;background:none}
.ver{position:relative;flex:none;padding:0 14px;line-height:0;white-space:nowrap}
.ver::before,.ver::after{content:"";position:absolute;top:-6px;width:2px;height:12px;background:var(--mast-line)}
.ver::before{left:0}.ver::after{right:0}
.mast-row{display:flex;justify-content:space-between;align-items:center;gap:6px 18px;flex-wrap:wrap;padding:9px 14px 11px}
.mark{font-family:"Silkscreen","VT323",ui-monospace,monospace;font-weight:700;font-size:32px;line-height:1;letter-spacing:.02em;margin:0;color:var(--mast-logo)}
.knobs{display:flex;gap:2px 18px;flex-wrap:wrap}
.knobs button{padding:2px 4px;white-space:pre}
.knobs b{font-weight:400;text-decoration:underline;text-underline-offset:3px}

/* Barre de titre : dit sur quel écran on se trouve */
.bar{
  position:relative;z-index:5;margin:0 3px;border-radius:999px;background:var(--bar-bg);color:var(--bar-ink);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 12px 3px 26px;min-height:28px;
}
.bar h1{font-family:"Silkscreen","VT323",ui-monospace,monospace;font-weight:700;font-size:17px;line-height:1.1;letter-spacing:.08em;text-transform:uppercase;margin:0;overflow-wrap:anywhere}
#menu-btn{display:grid;place-items:center;width:34px;height:22px;color:var(--bar-icon);border-radius:6px}
#menu-btn svg{width:22px;height:14px}
#menu{
  position:absolute;right:8px;top:100%;margin-top:5px;z-index:20;display:grid;min-width:230px;
  background:var(--term-base);color:var(--term-out);border:2px solid var(--term-out);padding:6px 10px;
  grid-template-columns:auto auto;column-gap:18px;
}
#menu button{text-align:left;white-space:pre;padding:1px 2px;color:var(--c,var(--term-out))}
#menu button:hover,#menu button:focus{background:var(--term-out);color:var(--term-base);outline:0}

/* Le vide : c’est là que vit le décor */
.stage{position:relative;min-height:0;overflow:hidden;background:#000}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:grab}
#scene.drag{cursor:grabbing}
#scene.pick{cursor:pointer}
.mesh{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--mesh) 1px,transparent 1px),linear-gradient(90deg,var(--mesh) 1px,transparent 1px);background-size:4px 4px}
#places button,#tag{position:absolute;left:0;top:0;background:var(--plate);padding:0 7px;white-space:nowrap}
#places button{color:var(--c)}
#tag{pointer-events:none;color:var(--term-prompt)}
#tag small{font-size:inherit;color:var(--term-out);margin-left:10px}

/* Le terminal : il part du bas et monte à mesure qu’on écrit */
.term{
  position:absolute;left:0;right:0;bottom:0;max-height:58%;display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--term-base);color:var(--term-out);
}
@supports (color: color-mix(in srgb, red, blue)){
  .term{
    background:color-mix(in srgb, var(--hue, var(--term-base)) 25%, var(--hue-shade, var(--term-base)));
    color:color-mix(in srgb, var(--hue, var(--term-out)) 58%, var(--hue-tint, var(--term-out)));
  }
}
.term.boot{--term-base:var(--boot-base);--term-out:var(--boot-out)}
.term.tinted{--hue-shade:var(--shade);--hue-tint:var(--tint)}
.scroll{overflow-y:auto;scrollbar-width:none;padding-bottom:5px}
.scroll::-webkit-scrollbar{display:none}
.head .mark{font-size:27px;color:inherit;padding:3px 8px 7px}
.head hr{border:0;border-top:2px solid currentColor;margin:0 0 16px}
.line{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 8px;min-height:1.08em;margin:0}
.ps{color:var(--term-prompt)}
.cmd{color:var(--term-cmd)}
.nm{color:var(--c);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.prompt{display:flex}
.prompt input{flex:1;min-width:0;background:none;border:0;outline:0;padding:0;margin:0;color:var(--term-cmd);caret-color:var(--term-cmd)}
.prompt:focus-within{background:var(--plate)}
#boot-go button{color:var(--term-prompt);text-decoration:underline;text-underline-offset:3px;margin-right:2ch}
.inv{background:var(--term-out);color:var(--term-base)}
/* Les applications : un écran plein, en mode texte, avec sa ligne de touches en bas */
#app{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;background:var(--term-base);color:var(--term-out)}
#app-main{flex:1;min-height:0;overflow:auto;scrollbar-width:none;position:relative}
#app-main::-webkit-scrollbar{display:none}
#app-body{white-space:pre;padding:8px 10px}
#app-body .line{white-space:pre-wrap;padding:0}
#app-body u{text-underline-offset:3px}
#app-cv{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#120a04}
canvas.img{display:block;margin:6px 0 10px 2ch;width:288px;max-width:80%;height:auto;image-rendering:pixelated;border:2px solid currentColor}
#app-keys{margin:0;background:var(--bar-bg);color:var(--bar-ink);padding:3px 10px;white-space:pre-wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  body{font-size:18px}
  .mark{font-size:25px}
  .mast-row{padding:7px 10px 9px}
  .bar h1{font-size:14px}
  .edge .morse{flex-basis:36px}
  .edge .gap{flex-basis:12px}
  .term{max-height:55%}
}
</style>

function fmtSize(mb){
  const f = (n,d) => n.toLocaleString('fr-FR',{maximumFractionDigits:d});
  if(mb < 1) return f(Math.max(1,Math.round(mb*1024)),0)+' Ko';
  if(mb < 1000) return f(mb, mb<10?1:0)+' Mo';
  if(mb < 1e6) return f(mb/1000, mb<1e4?1:0)+' Go';
  return f(mb/1e6,1)+' To';
}

function makeCage(t){
  const W=t.w+.9, Dp=t.dp+.9, H=t.h+.9, pts=[], n=Math.ceil(H/.42);
  for(let k=0;k<=n;k++){ const y=H*k/n, a=W/2, b=Dp/2; pts.push(-a,y,-b, a,y,-b,  a,y,-b, a,y,b,  a,y,b, -a,y,b,  -a,y,b, -a,y,-b); }
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(s=>pts.push(s[0]*W/2,0,s[1]*Dp/2, s[0]*W/2,H,s[1]*Dp/2));
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  t.cage=new THREE.LineSegments(g, new THREE.LineBasicMaterial({transparent:true, opacity:.55}));
  t.cage.userData={flash:0, melt:-1}; t.g.add(t.cage);
}
function makeArc(t){
  const l=Math.hypot(t.x,t.z)||1, dx=t.x/l, dz=t.z/l, pts=[];
  for(let i=0;i<=56;i++){ const u=i/56; pts.push(t.x+dx*260*u, t.h+ (4*u*(1-u))*60 - t.h*u, t.z+dz*260*u); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  t.arc=new THREE.Line(g, new THREE.LineBasicMaterial({transparent:true, opacity:.65})); scene.add(t.arc);
}

const SHADE=[.74,.56,1,.4,.9,.66];   // +x, −x, dessus, dessous, +z, −z
const tmp=C(0), tmp2=C(0);
function paint(t){
  const hue=P.hues[t.d.hue], col=t.body.geometry.attributes.color, pos=t.body.geometry.attributes.position;
  for(let i=0;i<24;i++){
    const f=Math.floor(i/4), y=pos.getY(i);
    if(P.night){ const k=SHADE[f]*(f===2 ? 1 : .1+.9*Math.pow(y,1.6)); tmp.copy(P.base).lerp(hue, k); }
    else { tmp.copy(hue).lerp(P.ink, (1-SHADE[f])*.55); if(f===2) tmp.lerp(WHITE,.3); else tmp.lerp(WHITE,.34*(1-y)); }
    col.setXYZ(i,tmp.r,tmp.g,tmp.b);
  }
  col.needsUpdate=true;
}
function applyTheme(){
  const cs=getComputedStyle(document.documentElement), v=n=>cs.getPropertyValue(n).trim();
  P.night = v('--scene')!=='day';
  P.top.set(v('--sky-top')); P.midCalm.set(v('--sky-mid-calm')); P.midHot.set(v('--sky-mid-hot'));
  P.hzCalm.set(v('--sky-hz-calm')); P.hzHot.set(v('--sky-hz-hot'));
  P.ground.set(v('--ground')); P.grid.set(v('--grid')); P.base.set(v('--tower-base')); P.wall.set(v('--wall')); P.ink.set(v('--ink'));
  P.hues=[1,2,3,4,5,6].map(i=>C(v('--h'+i)));
  const add = P.night ? THREE.AdditiveBlending : THREE.NormalBlending;
  sky.material.uniforms.top.value.copy(P.top);
  ground.material.color.copy(P.ground);
  gridMat.color.copy(P.grid); gridMat.opacity = P.night ? .42 : .5;
  pads.forEach(p=>{ const h=P.hues[p.d.hue];
    p.pad.material.color.copy(h); p.pad.material.opacity = P.night ? .13 : .2;
    p.line.material.color.copy(h); });
  towers.forEach(t=>{ const h=P.hues[t.d.hue];
    paint(t);
    t.pool.material.blending=add; t.pool.material.color.copy(P.night ? h : P.ink); t.pool.material.needsUpdate=true;
    t.beam.material.color.copy(h); t.beam.material.blending=add; t.beam.material.needsUpdate=true;
    if(t.cage) t.cage.material.color.copy(P.wall);
    if(t.arc){ t.arc.material.color.copy(h); }
  });
  flowMat.blending=add; flowMat.needsUpdate=true;
  flow.p.forEach((p,i)=>{ const h=P.hues[p.hue]; tmp.copy(h); if(P.night) tmp.lerp(WHITE,.25);
    flow.col[i*3]=tmp.r; flow.col[i*3+1]=tmp.g; flow.col[i*3+2]=tmp.b; });
  flowGeo.attributes.color.needsUpdate=true;
  starMat.color.set(P.night ? 0xffffff : 0x000000);
  rings.forEach(r=>{ r.material.blending=add; r.material.needsUpdate=true; });
  selRing.material.blending=add; selRing.material.needsUpdate=true;
}
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

function stateOf(t){
  if(t.d.kind==='proc') return 'charge '+Math.round(t.load*100)+' %';
  if(t.d.kind==='net') return t.locked ? 'injoignable' : t.ms+' ms';
  return t.locked ? 'fermé' : t.opened ? 'ouvert pour cette session' : 'ouvert';
}
function describe(t){
  print('<span style="color:'+hueOf(t.d)+'">'+esc(t.path)+'</span>');
  const rows = t.d.kind==='proc' ? [['Mémoire', fmtSize(t.size)], ['Charge', Math.round(t.load*100)+' %'], ['État', 'en marche']]
    : t.d.kind==='net' ? [['Volume', fmtSize(t.size)], ['Distance', t.locked ? 'injoignable' : t.ms+' ms'], ['Accès', t.locked ? 'fermé, la porte ne répond pas' : 'ouvert']]
    : [['Taille', fmtSize(t.size)], ['Propriétaire', t.d.owner], ['Accès', t.locked ? 'fermé, réservé à root' : t.opened ? 'ouvert pour cette session' : 'ouvert']];
  rows.unshift(['Type', t.o.type]);
  rows.forEach(r=>say('   '+r[0]+gap(r[0],15)+r[1]));
  say('   '+t.detail);
  if(!t.locked && (t.o.data || t.o.type==='agent' || t.o.type==='journal')) say('[Entrée] sur une ligne vide l’ouvre.');
  if(t.locked && t.d.kind==='file') say('Tape cle pour demander la clé.');
}

// Retrouver un lieu depuis ce qui est tapé : quartier, bloc, « quartier/bloc » ou chemin Unix
function resolve(raw){
  const a=norm(raw.trim()).replace(/\/+$/,'');
  if(!a) return null;
  if(a==='tout') return {top:true};
  const dFind=s=>DISTRICTS.find(d=>norm(d.label)===s || slug(norm(d.label))===s || d.id===s || norm(d.prefix).replace(/\/$/,'')===s);
  const d=dFind(a); if(d) return {d};
  const pick=list=>{
    if(list.length===1) return {t:list[0]};
    if(list.length>1){ const here=list.filter(t=>t.d===focusD); return here.length===1 ? {t:here[0]} : {many:list}; }
    return null; };
  const i=a.indexOf('/');
  if(i>0){ const dd=dFind(a.slice(0,i)), n=a.slice(i+1);
    if(dd){ const r=pick(towers.filter(t=>t.d===dd && norm(t.name)===n)) || pick(towers.filter(t=>t.d===dd && norm(t.name).indexOf(n)===0)); if(r) return r; } }
  const byPath=towers.filter(t=>norm(t.path)===a); if(byPath.length===1) return {t:byPath[0]};
  const dp=DISTRICTS.filter(x=>norm(x.label).indexOf(a)===0);
  return pick(towers.filter(t=>norm(t.name)===a)) || (dp.length===1 ? {d:dp[0]} : null)
      || pick(towers.filter(t=>norm(t.name).indexOf(a)===0)) || pick(towers.filter(t=>norm(t.name).indexOf(a)>=0));
}
function ambiguous(list){
  say(list.length+' blocs portent ce nom. Précise le quartier :');
  list.slice(0,10).forEach(t=>print('   '+link(addr(t), addr(t), t.d)));
}

const SIZEU={ko:1/1024, mo:1, go:1000, to:1e6};
function agg(expr, objs){
  const k=/^(count|sum|avg|max|min)\((\*|\w+)\)$/.exec(expr); if(!k) return undefined;
  if(k[1]==='count') return objs.length;
  const f=COLS[k[2]]; if(!f) throw new Error('Colonne inconnue : '+k[2]);
  const xs=objs.map(f).filter(x=>typeof x==='number'); if(!xs.length) return 0;
  const sum=xs.reduce((a,b)=>a+b,0);
  return k[1]==='sum' ? sum : k[1]==='avg' ? sum/xs.length : k[1]==='max' ? Math.max.apply(null,xs) : Math.min.apply(null,xs);
}
function sqlRun(q){
  const m=/^select\s+(.+?)\s+from\s+objets(?:\s+where\s+(.+?))?(?:\s+group\s+by\s+(\w+))?(?:\s+order\s+by\s+([\w(*)]+)(?:\s+(asc|desc))?)?(?:\s+limit\s+(\d+))?\s*;?\s*$/i.exec(q.trim());
  if(!m) throw new Error('Requête non comprise. Forme : select colonnes from objets [where …] [group by colonne] [order by colonne [desc]] [limit n]');
  let rows=OBJ.slice();
  if(m[2]) m[2].split(/\s+and\s+/i).forEach(c=>{
    const k=/^(\w+)\s*(=|!=|<>|>=|<=|>|<|like)\s*(.+)$/i.exec(c.trim()), col=k && COLS[k[1].toLowerCase()];
    if(!col) throw new Error('Condition non comprise : '+c);
    const op=k[2].toLowerCase(), raw=k[3].trim().replace(/^['"]|['"]$/g,'');
    if(typeof col(OBJ[0])==='number'){
      const n=/^([\d.,]+)\s*(ko|mo|go|to)?$/i.exec(raw); if(!n) throw new Error('Il faut un nombre dans : '+c);
      const v=parseFloat(n[1].replace(',','.'))*(n[2] ? SIZEU[n[2].toLowerCase()] : 1);
      rows=rows.filter(o=>{ const x=col(o); return op==='=' ? x===v : op==='!='||op==='<>' ? x!==v : op==='>' ? x>v : op==='<' ? x<v : op==='>=' ? x>=v : op==='<=' ? x<=v : false; });
    } else {
      const v=norm(raw), re=op==='like' ? new RegExp('^'+v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*')+'$') : null;
      rows=rows.filter(o=>{ const x=norm(String(col(o))); return op==='=' ? x===v : op==='!='||op==='<>' ? x!==v : op==='like' ? re.test(x) : op==='>' ? x>v : op==='<' ? x<v : false; });
    }
  });
  let cols=m[1].split(',').map(s=>s.trim().toLowerCase()), out;
  const isAgg=c=>/^\w+\(/.test(c);
  if(m[3]){
    const g=m[3].toLowerCase(), f=COLS[g]; if(!f) throw new Error('Colonne inconnue : '+g);
    cols.forEach(c=>{ if(c!==g && agg(c,[])===undefined) throw new Error('Avec group by, garde la colonne groupée et des agrégats. En trop : '+c); });
    const map=new Map(); rows.forEach(o=>{ const k=String(f(o)); if(!map.has(k)) map.set(k,[]); map.get(k).push(o); });
    out=[...map].map(e=>({v:cols.map(c=>c===g ? e[0] : agg(c,e[1])), objs:e[1]}));
  } else if(cols.every(isAgg)){
    cols.forEach(c=>{ if(agg(c,[])===undefined) throw new Error('Agrégat non compris : '+c); });
    out=[{v:cols.map(c=>agg(c,rows)), objs:rows}];
  } else {
    if(cols.length===1 && cols[0]==='*') cols=['nom','type','bib','taille','acces'];
    cols.forEach(c=>{ if(!COLS[c]) throw new Error('Colonne inconnue : '+c+'. Colonnes : '+Object.keys(COLS).join(', ')); });
    out=rows.map(o=>({v:cols.map(c=>COLS[c](o)), o}));
  }
  if(m[4]){
    const oc=m[4].toLowerCase(), i=cols.indexOf(oc), dir=(m[5]||'asc').toLowerCase()==='desc' ? -1 : 1;
    const key=i>=0 ? r=>r.v[i] : COLS[oc] ? r=>r.o ? COLS[oc](r.o) : 0 : null; if(!key) throw new Error('Tri impossible sur '+oc);
    out.sort((a,b)=>{ const x=key(a), y=key(b); return (typeof x==='number' && typeof y==='number' ? x-y : String(x).localeCompare(String(y),'fr'))*dir; });
  }
  if(m[6]) out=out.slice(0,+m[6]);
  return {cols, rows:out};
}
const fmtCell=(c,v)=>typeof v!=='number' ? String(v) : /taille/.test(c) ? fmtSize(v) : /charge/.test(c) ? Math.round(v)+' %' : v.toLocaleString('fr-FR',{maximumFractionDigits:1});
function table(r, max){
  const rows=r.rows.slice(0,max).map(x=>x.v.map((v,i)=>fmtCell(r.cols[i],v)));
  const w=r.cols.map((c,i)=>rows.reduce((a,x)=>Math.max(a,x[i].length), c.length));
  const num=r.cols.map((c,i)=>r.rows.length>0 && typeof r.rows[0].v[i]==='number');
  const fmt=x=>x.map((s,i)=>num[i] ? s.padStart(w[i]) : s.padEnd(w[i])).join('  ');

}

  phare(c,w,h){ const g=c.createLinearGradient(0,0,0,h*.62); g.addColorStop(0,'#ffe9a8'); g.addColorStop(1,'#ffb37a'); c.fillStyle=g; c.fillRect(0,0,w,h);
    c.fillStyle='#fff6dc'; c.beginPath(); c.arc(70,22,9,0,7); c.fill();
    ['#d9824a','#c96f3e','#b65e36','#9c4f30','#84422b','#6b3626'].forEach((col,i)=>{ c.fillStyle=col; c.fillRect(0,40+i*4,w,4); });
    c.fillStyle='#5a3410'; c.beginPath(); c.moveTo(0,46); c.lineTo(34,42); c.lineTo(46,50); c.lineTo(0,58); c.fill();
    for(let i=0;i<6;i++){ c.fillStyle=i%2 ? '#d1366f' : '#fff6dc'; c.fillRect(20,14+i*5,7,5); }
    c.fillStyle='#2f1a06'; c.fillRect(19,9,9,5); c.fillStyle='#ffef7a'; c.fillRect(21,10,5,3);
    c.fillStyle='rgba(255,239,122,.5)'; c.beginPath(); c.moveTo(26,11); c.lineTo(96,1); c.lineTo(96,19); c.fill(); },
  dunes(c,w,h){ c.fillStyle='#ffe9a8'; c.fillRect(0,0,w,h); c.fillStyle='#ffb36b'; c.beginPath(); c.arc(24,17,8,0,7); c.fill();
    ['#ffd27a','#ffbe6a','#f0a052','#d98442','#b96a36'].forEach((col,i)=>{ c.fillStyle=col; c.beginPath(); c.moveTo(0,h);
      for(let x=0;x<=w;x++) c.lineTo(x, 26+i*8+6*Math.sin(x*.07+i*1.9)+3*Math.sin(x*.19+i)); c.lineTo(w,h); c.fill(); }); },
  circuit(c,w,h){ c.fillStyle='#2a1706'; c.fillRect(0,0,w,h); const r=rng(303);
    for(let n=0;n<14;n++){ let x=(r()*w/4|0)*4, y=(r()*h/4|0)*4; c.fillStyle=n%3 ? '#ffb443' : '#ffe9a8';
      for(let k=0;k<26;k++){ c.fillRect(x,y,2,2); const d=r(); if(d<.45) x+=2; else if(d<.6) x-=2; else if(d<.8) y+=2; else y-=2; x=(x+w)%w; y=(y+h)%h; }
      c.fillStyle='#fff6dc'; c.fillRect(x-1,y-1,4,4); }
    c.fillStyle='#6b4416'; c.fillRect(36,22,24,20); c.fillStyle='#ffe9a8'; for(let i=0;i<6;i++){ c.fillRect(38+i*4,20,2,2); c.fillRect(38+i*4,42,2,2); } }
};
(function(){
  let hist=[], page=null, links=[];
  function image(nom){ const o=OBJ.find(x=>x.type==='image' && x.nom===nom), cv=document.createElement('canvas'); cv.width=96; cv.height=64; cv.className='img';
    if(o && GEN[o.data.g]) GEN[o.data.g](cv.getContext('2d'),96,64); return cv; }
  const add=html=>{ const d=document.createElement('div'); d.className='line'; d.innerHTML=html||' '; abody.appendChild(d); };
  function show(p, push){
    if(push && page) hist.push(page); page=p; links=[]; abody.innerHTML=''; amain.scrollTop=0; setAppTitle(p.nom);
    p.src.forEach(l=>{ let m;
      if((m=/^\{\{image:(.+)\}\}$/.exec(l))){ abody.appendChild(image(m[1])); return; }
      if((m=/^\{\{liste:(.+)\}\}$/.exec(l))){ byType(m[1]).forEach(o=>{ links.push('objet:'+o.nom); add(esc('  '+o.nom+', '+fmtSize(o.taille)+' ['+links.length+']')); if(o.type==='image') abody.appendChild(image(o.nom)); }); return; }
      if(l.indexOf('# ')===0){ add('<span class="inv">'+esc(' '+l.slice(2)+' ')+'</span>'); add(''); return; }
      add(esc(l).replace(/\[\[(.+?)\|(.+?)\]\]/g, (_,to,lab)=>{ links.push(to.replace(/&amp;/g,'&')); return '<u>'+lab+'</u> ['+links.length+']'; }));
    });
  }
  function go(name){
    const n=norm(name.trim().replace(/^trame:\/\//,''));
    if(/^https?:/.test(n)){ add(''); add(esc('Le vrai web n’est pas joignable depuis la maquette : '+name.trim())); amain.scrollTop=amain.scrollHeight; return; }
    const o=OBJ.find(x=>(x.type==='page'||x.type==='image') && norm(x.nom)===n);
    if(!o){ add(''); add(esc('Page introuvable : '+name.trim())); amain.scrollTop=amain.scrollHeight; return; }
    show(o.type==='image' ? imgPage(o) : {nom:o.nom, src:o.data.src}, true);
  }
  const imgPage=o=>({nom:o.nom, src:['# '+o.nom, '{{image:'+o.nom+'}}', o.t.detail+', '+fmtSize(o.taille)+', rangée dans « '+o.bib+' ».', '', '  [[galerie|Toute la galerie]]']});
  APPS.web={titre:'Web', keys:'[1-9] suivre un lien   [↑][↓] défiler   [←] page précédente   [G] aller à une adresse   [Échap] quitter',
    open(x){ hist=[]; page=null; const o=x && (x.type==='page'||x.type==='image') ? x : OBJ.find(p=>p.type==='page' && p.nom==='accueil'); show(o.type==='image' ? imgPage(o) : {nom:o.nom, src:o.data.src}); },
    key(e){ const k=e.key.toLowerCase(), lh=metrics().lh;
      if(/^[1-9]$/.test(k)){ const to=links[+k-1]; if(to){ if(to.indexOf('objet:')===0){ const o=OBJ.find(x=>x.nom===to.slice(6) && x.data); if(o) openObj(o); } else go(to); } }
      else if(k==='arrowdown') amain.scrollTop+=lh*2; else if(k==='arrowup') amain.scrollTop-=lh*2;
      else if(k==='pagedown'||k===' ') amain.scrollTop+=amain.clientHeight*.8; else if(k==='pageup') amain.scrollTop-=amain.clientHeight*.8;
      else if(k==='arrowleft'||k==='backspace'){ if(hist.length) show(hist.pop()); }
      else if(k==='g'){ ask('Adresse : ', 'trame://', v=>{ if(v.trim()) go(v); }); }
      else return false;
      return true; } };
})();

/* ═══════════════════════ Agents : ils vivent dans la base ═══════════════════════ */
const AGENTS=[
  {nom:'vigie', role:'surveiller les charges et les journaux', salon:'#veille', zone:['proc','log'], hue:4},
  {nom:'archiviste', role:'connaître la base interne et retrouver n’importe quel objet', salon:'#trame', zone:['home','srv','etc','log','proc','net'], hue:0},
  {nom:'luthier', role:'régler l’ambiance sonore et les morceaux', salon:'#atelier', zone:['home'], hue:2},
  {nom:'portier', role:'garder les clés des blocs fermés', salon:'#veille', zone:['etc','srv'], hue:1}];
let engine='local', sampleFn=null, orKey='', orModel='openrouter/auto';
const HOSTED=location.protocol!=='file:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
if(window.claude && window.claude.use) window.claude.use('sample').then(s=>{ if(s){ sampleFn=s; if(engine==='local') engine='claude'; } }).catch(()=>{});
const engineLabel=()=>engine==='claude' ? 'Claude, sur le compte de la personne qui regarde la page (il tient ici la place d’OpenRouter)'
  : engine==='openrouter' ? 'OpenRouter, modèle '+orModel : 'local (réponses écrites à la main à partir de la base)';
const rules=a=>'Tu es '+a.nom+', un agent qui vit à l’intérieur de Trame, un système expérimental où tout est un objet d’une base interne. Ton rôle : '+a.role+'. '
  +'Réponds en français, en une à trois phrases courtes, sur un ton direct, sans liste ni mise en forme. '
  +'Pour tout chiffre ou tout nom d’objet, interroge la base avec l’outil sql au lieu de deviner. Table unique : objets(nom, type, bib, taille en Mo, proprio, acces, charge en %, chemin). '
  +'Types : '+Array.from(new Set(OBJ.map(o=>o.type))).join(', ')+'. Bibliothèques : '+DISTRICTS.map(d=>d.label).join(', ')+'. '
  +'En ce moment : l’utilisateur regarde '+(selected ? selected.path : focusD ? focusD.label : 'la vue d’ensemble')+', ambiance '+mood.mode+' à '+Math.round(mood.I*100)+' %, son '+(soundOn ? Sound.style : 'coupé')+'.';
const SQL_HELP='Exécute une requête SELECT sur la base interne de Trame et renvoie les lignes en texte. Forme : select colonnes from objets [where colonne op valeur and …] [group by colonne] [order by colonne desc] [limit n]. Agrégats : count(*), sum(taille), avg(charge), max(taille), min(taille).';
function scripted(a, text){
  const s=norm(text), top=byType('programme').concat(byType('agent')).sort((x,y)=>y.t.load-x.t.load);
  if(/charge|cpu|lent|rame|processus|programme/.test(s)) return top.slice(0,3).map(o=>o.nom+' à '+Math.round(o.t.load*100)+' %').join(', ')+'. Le reste est tranquille.';
  if(/gros|lourd|taille|place|pese/.test(s)) return 'Les plus lourds : '+OBJ.slice().sort((x,y)=>y.taille-x.taille).slice(0,3).map(o=>o.chemin+' ('+fmtSize(o.taille)+')').join(', ')+'.';
  if(/ferme|cle|droit|verrou|acces/.test(s)){ const l=OBJ.filter(o=>o.t.locked); return l.length+' blocs sont fermés : '+l.slice(0,6).map(o=>o.nom).join(', ')+(l.length>6 ? ', et d’autres' : '')+'. Va sur l’un d’eux et tape cle.'; }
  if(/combien|compte|objets|base|types?/.test(s)){ const m={}; OBJ.forEach(o=>{ m[o.type]=(m[o.type]||0)+1; }); return 'La base tient '+OBJ.length+' objets : '+Object.keys(m).map(k=>m[k]+' '+k).join(', ')+'.'; }
  if(/musique|morceau|son|ambiance|tempo/.test(s)) return 'Ambiance '+mood.mode+' à '+Math.round(mood.I*100)+' %, son '+(soundOn ? Sound.style : 'coupé')+'. Morceaux de la base : '+byType('morceau').map(o=>o.nom).join(', ')+'.';
  if(/bonjour|salut|qui es|aide|que sais|quoi/.test(s)) return 'Je suis '+a.nom+'. Mon rôle : '+a.role+'. Demande-moi les charges, les plus gros objets, ce qui est fermé, ou ce que contient la base.';
  const r=resolve(text.replace(/^.*?(ou est|où est|cherche|trouve|montre)\s+/i,'').replace(/[?!.]+$/,''));
  if(r && r.t) return r.t.path+' : '+r.t.o.type+', '+fmtSize(r.t.size)+', '+(r.t.locked ? 'fermé' : 'ouvert')+'.';
  return 'Sans modèle de langage branché, je ne réponds qu’à quelques sujets : charges, tailles, clés, contenu de la base, musique.';
}
async function openrouter(a, text, turns){
  const msgs=[{role:'system',content:rules(a)}].concat(turns,[{role:'user',content:text}]);
  const tools=[{type:'function', function:{name:'sql', description:SQL_HELP, parameters:{type:'object', properties:{requete:{type:'string'}}, required:['requete']}}}];
  for(let round=0; round<4; round++){
    const res=await fetch('https://openrouter.ai/api/v1/chat/completions', {method:'POST',
      headers:{'Authorization':'Bearer '+orKey, 'Content-Type':'application/json', 'X-Title':'Trame'},
      body:JSON.stringify({model:orModel, messages:msgs, tools, max_tokens:400})});
    if(!res.ok) throw new Error('réponse '+res.status);
    const m=(await res.json()).choices[0].message;
    if(!m.tool_calls || !m.tool_calls.length) return (m.content||'').trim();
    msgs.push(m);
    m.tool_calls.forEach(c=>{ let out; try{ out=sqlText(JSON.parse(c.function.arguments||'{}').requete); }catch(e){ out='Erreur : '+e.message; } msgs.push({role:'tool', tool_call_id:c.id, content:out}); });
  }
  return 'Je tourne en rond dans la base. Repose-moi la question plus simplement.';
}
async function think(a, text){
  const turns=a.hist.slice(-8); let r;
  if(engine==='claude' && sampleFn){
    try{
      const res=await sampleFn([{role:'user',content:rules(a)},{role:'assistant',content:'Compris.'}].concat(turns,[{role:'user',content:text}]),
        {cache:false, modelTier:'quick', tools:[{name:'sql', description:SQL_HELP, inputSchema:{type:'object', properties:{requete:{type:'string', description:'La requête SELECT'}}, required:['requete']}, execute:i=>sqlText(i.requete)}]});
      r=(res.text||'').trim()||scripted(a,text);
    }catch(e){ if(e && e.code==='not_granted') engine='local'; r=scripted(a,text)+(e && e.code==='not_granted' ? ' (Modèle refusé pour cette page : je réponds à la main.)' : ' (Modèle injoignable : réponse écrite à la main.)'); }
  } else if(engine==='openrouter' && orKey){
    try{ r=await openrouter(a,text,turns)||scripted(a,text); }catch(e){ r=scripted(a,text)+' (OpenRouter : '+String(e.message||e).slice(0,80)+'.)'; }
  } else r=scripted(a,text);
  a.hist.push({role:'user',content:text},{role:'assistant',content:r}); if(a.hist.length>16) a.hist.splice(0,2);
  return r;
}

/* ── IRC : les salons sont des objets, les agents y écrivent ── */
const irc={chans:byType('salon').map(o=>({nom:o.nom, o, unread:0})), ci:0, nick:'toi'};
const hhmm=()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const unreadAll=()=>irc.chans.reduce((s,c)=>s+c.unread,0);
function chan(nom){ let c=irc.chans.find(x=>x.nom===nom); if(!c){ c={nom, o:{data:{l:[]}}, unread:0, pv:true}; irc.chans.push(c); } return c; }
function ircPost(nom, who, text){
  const c=chan(nom); c.o.data.l.push([hhmm(), who, text]); if(c.o.data.l.length>200) c.o.data.l.shift();
  if(!(cur===APPS.irc && irc.chans[irc.ci]===c)) c.unread++;
  saveDB(); setKnobs(); if(cur===APPS.irc) APPS.irc.draw(); return c;
}
function ircAnswer(c, a, text){
  const row=[hhmm(), '*', a.nom+' réfléchit…']; c.o.data.l.push(row); if(cur===APPS.irc) APPS.irc.draw();
  think(a, text).then(r=>{ row[1]=a.nom; row[2]=r; if(!(cur===APPS.irc && irc.chans[irc.ci]===c)) c.unread++; saveDB(); setKnobs(); if(cur===APPS.irc) APPS.irc.draw(); });
}
APPS.irc={titre:'IRC', keys:'[Entrée] envoyer   [Tab] salon suivant   /msg agent texte   /who   /nick nom   /clear   [Échap] quitter',
  open(x){
    if(x && x.type==='salon') irc.ci=Math.max(0, irc.chans.findIndex(c=>c.nom===x.nom));
    else if(x && x.type==='agent') irc.ci=irc.chans.indexOf(chan('@'+x.nom));
    this.draw(); this.prompt(); },
  prompt(){ ask('['+irc.chans[irc.ci].nom+'] ', '', v=>this.send(v), true); },
  draw(){
    const c=irc.chans[irc.ci], m=metrics(), W=Math.max(30, Math.floor(abody.clientWidth/m.cw)-2), rows=Math.max(4, Math.floor(amain.clientHeight/m.lh)-3);
    c.unread=0; setKnobs(); setAppTitle(c.nom);
    const tabs=irc.chans.map((x,i)=>{ const s=' '+(i+1)+':'+x.nom+(x.unread ? '('+x.unread+')' : '')+' '; return i===irc.ci ? '<span class="inv">'+esc(s)+'</span>' : esc(s); }).join('');
    const out=[];
    c.o.data.l.forEach(r=>{
      const a=AGENTS.find(g=>g.nom===r[1]), pre=r[0]+(r[1]==='*' ? '  * ' : ' <'+r[1]+'> '), w=Math.max(12, W-pre.length), words=String(r[2]).split(/\s+/); let ln='', first=true;
      const flush=()=>{ out.push((first ? (a ? esc(r[0]+' <')+'<span style="color:var(--h'+(a.hue+1)+')">'+esc(r[1])+'</span>'+esc('> ') : esc(pre)) : ' '.repeat(pre.length))+esc(ln)); first=false; ln=''; };
      words.forEach(wd=>{ if(ln && (ln+' '+wd).length>w) flush(); ln=ln ? ln+' '+wd : wd; }); flush();
    });
    if(!out.length) out.push(esc(c.pv ? '  Conversation privée. Écris, '+c.nom.slice(1)+' répondra.' : '  Salon vide pour l’instant. Les agents y passent de temps en temps.'));
    abody.innerHTML=tabs+'\n'+esc('-'.repeat(W))+'\n'+out.slice(-rows).join('\n');
  },
  send(v){
    const c=irc.chans[irc.ci], s=v.trim(); if(!s) return;
    if(s[0]!=='/'){
      ircPost(c.nom, irc.nick, s); nudge(.08);
      const a=c.pv ? AGENTS.find(g=>'@'+g.nom===c.nom) : (AGENTS.find(g=>norm(s).indexOf(g.nom)>=0) || AGENTS.find(g=>g.salon===c.nom));
      if(a) ircAnswer(c, a, s); return; }
    const sp=s.search(/\s/), cmd=(sp<0 ? s : s.slice(0,sp)).toLowerCase(), arg=sp<0 ? '' : s.slice(sp+1).trim(), note=t=>{ c.o.data.l.push([hhmm(),'*',t]); this.draw(); };
    if(cmd==='/msg'){ const k=arg.search(/\s/), n=norm(k<0 ? arg : arg.slice(0,k)).replace(/^@/,''), a=AGENTS.find(g=>g.nom===n);
      if(!a){ note('Personne ne répond à ce nom. Présents : '+AGENTS.map(g=>g.nom).join(', ')+'.'); return; }
      irc.ci=irc.chans.indexOf(chan('@'+a.nom)); this.draw(); askL.textContent='['+irc.chans[irc.ci].nom+'] '; if(k>=0) this.send(arg.slice(k+1)); }
    else if(cmd==='/who') note('Présents : '+irc.nick+', '+AGENTS.map(g=>g.nom).join(', ')+'.');
    else if(cmd==='/nick'){ if(arg) irc.nick=arg.replace(/\s+/g,'_').slice(0,16); note('Tu es maintenant '+irc.nick+'.'); }
    else if(cmd==='/clear'){ c.o.data.l.length=0; saveDB(); this.draw(); }
    else if(cmd==='/join'){ const k=irc.chans.findIndex(x=>x.nom===arg); if(k>=0){ irc.ci=k; this.draw(); askL.textContent='['+arg+'] '; } else note('Ce salon n’existe pas dans la base. Salons : '+irc.chans.filter(x=>!x.pv).map(x=>x.nom).join(', ')+'.'); }
    else if(cmd==='/quit') closeApp();
    else note('Commande inconnue : '+cmd+'. Essaie /msg, /who, /nick, /clear, /join.');
  },
  inKey(e){ if(e.key==='Tab'){ irc.ci=(irc.ci+(e.shiftKey ? irc.chans.length-1 : 1))%irc.chans.length; this.draw(); askL.textContent='['+irc.chans[irc.ci].nom+'] '; return true; } return false; }
};

/* ── Agents : la liste, et le choix du moteur ── */
APPS.agents={titre:'Agents', i:0, keys:'[↑][↓] choisir   [Entrée] lui parler   [M] changer de moteur   [K] clé OpenRouter   [O] modèle   [Échap] quitter',
  open(x){ if(x && x.type==='agent') this.i=Math.max(0, AGENTS.findIndex(a=>a.nom===x.nom)); this.draw(); this.tm=setInterval(()=>{ if(askRow.hidden) this.draw(); }, 1000); },
  close(){ clearInterval(this.tm); },
  draw(){
    const L=[' Quatre agents vivent dans la base. Ils se déplacent, observent, et écrivent dans les salons.','','   '+'nom'.padEnd(12)+'rôle'.padEnd(60)+'près de'];
    AGENTS.forEach((a,i)=>L.push((i===this.i ? ' > ' : '   ')+a.nom.padEnd(12)+a.role.padEnd(60)+(a.near||'')));
    L.push('', ' Moteur : '+engineLabel()+'.',
      HOSTED ? ' OpenRouter : injoignable depuis une page publiée. Il se branche dans la version locale.' : ' OpenRouter : [K] pour donner ta clé. Elle reste en mémoire, jamais enregistrée.',
      ' Avec un moteur branché, chaque agent lance ses propres select sur la base avant de répondre.');
    abody.innerHTML=L.map((l,i)=>i-3===this.i && i<3+AGENTS.length ? '<span class="inv">'+esc(l)+'</span>' : esc(l)).join('\n');
  },
  key(e){ const k=e.key.toLowerCase();
    if(k==='arrowup') this.i=(this.i+3)%4; else if(k==='arrowdown') this.i=(this.i+1)%4;
    else if(k==='enter'){ openApp('irc', {type:'agent', nom:AGENTS[this.i].nom}); return true; }
    else if(k==='m'){ const l=['local'].concat(sampleFn ? ['claude'] : [], !HOSTED && orKey ? ['openrouter'] : []); engine=l[(l.indexOf(engine)+1)%l.length]; }
    else if(k==='k'){ if(!HOSTED){ ask('Clé OpenRouter (non enregistrée) : ', '', v=>{ orKey=v.trim(); if(orKey) engine='openrouter'; this.draw(); }); askIn.type='password'; } return true; }
    else if(k==='o'){ ask('Modèle OpenRouter : ', orModel, v=>{ if(v.trim()) orModel=v.trim(); this.draw(); }); return true; }
    else return false;
    this.draw(); return true; } };

// Leur présence dans le décor, et ce qu’ils se disent
function pickTarget(a){ const c=towers.filter(t=>a.zone.indexOf(t.d.id)>=0 && (a.nom!=='portier' || t.locked)), t=c[Math.floor(Math.random()*c.length)]||towers[0];
  a.tt=t; a.tx=t.x+(Math.random()-.5); a.tz=t.z+(Math.random()-.5); }
AGENTS.forEach(a=>{
  a.hist=[]; a.mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.55), new THREE.MeshBasicMaterial({transparent:true, opacity:.96}));
  a.halo=new THREE.Mesh(FLAT, new THREE.MeshBasicMaterial({map:DOT, transparent:true, depthWrite:false, fog:false})); a.halo.scale.set(3.4,1,3.4); a.halo.position.y=.08; a.halo.renderOrder=4;
  scene.add(a.mesh); scene.add(a.halo); pickTarget(a); a.x=a.tx; a.z=a.tz; a.y=14; a.wait=Math.random()*3; a.near=a.tt.path;
});
let chatter=12;
function remark(a){
  const procs=byType('programme').concat(byType('agent')).sort((x,y)=>y.t.load-x.t.load), nL=OBJ.filter(o=>o.t.locked).length;
  if(a.nom==='vigie') return Math.random()<.55 ? procs[0].nom+' tient la tête avec '+Math.round(procs[0].t.load*100)+' % de charge.' : 'Rien d’anormal du côté de '+a.near+'.';
  if(a.nom==='archiviste') return lastOpened && Math.random()<.6 ? 'Dernier objet ouvert : '+lastOpened.chemin+', de type '+lastOpened.type+'.' : 'La base compte '+OBJ.length+' objets, pour '+fmtSize(OBJ.reduce((s,o)=>s+o.taille,0))+'.';
  if(a.nom==='luthier') return 'Ambiance à '+Math.round(mood.I*100)+' %. '+(mood.I>.55 ? 'Je serre le tempo.' : 'Je laisse respirer.')+(soundOn && Sound.style==='musique' ? ' On joue '+songName()+'.' : '');
  return lastKey ? 'La clé de '+lastKey+' tient toujours. Il reste '+nL+' blocs fermés.' : nL+' blocs fermés, aucune clé demandée.';
}
function agentsTick(dt){
  AGENTS.forEach((a,i)=>{
    const ax=a.tx-a.x, az=a.tz-a.z, d=Math.hypot(ax,az);
    if(d>.15){ const v=Math.min(d, (2.4+2.2*mood.I)*dt); a.x+=ax/d*v; a.z+=az/d*v; }
    else { a.near=a.tt.path; a.wait-=dt; if(a.wait<=0){ a.wait=2+Math.random()*5; pickTarget(a); } }
    a.y+=((d>3 ? 14.5 : a.tt.col.scale.y+1.1)-a.y)*(1-Math.exp(-dt*3));
    a.mesh.position.set(a.x, a.y+(reduce ? 0 : .18*Math.sin(clock*2+i*1.7)), a.z); a.mesh.rotation.y+=dt*1.6;
    a.mesh.material.color.copy(P.hues[a.hue]).lerp(P.night ? WHITE : P.ink, P.night ? .5 : .12);
    a.halo.position.x=a.x; a.halo.position.z=a.z; a.halo.material.color.copy(P.night ? P.hues[a.hue] : P.ink);
    a.halo.material.blending=P.night ? THREE.AdditiveBlending : THREE.NormalBlending; a.halo.material.opacity=P.night ? .6 : .22;
  });
  if(!entered) return;
  chatter-=dt; if(chatter<=0){ chatter=22+Math.random()*24; const a=AGENTS[Math.floor(Math.random()*AGENTS.length)]; ircPost(a.salon, a.nom, remark(a)); }
}

function openObj(o){

const LAYOUT={}, AZERTY={KeyQ:'a', KeyA:'q', KeyW:'z', KeyZ:'w', Semicolon:'m', KeyM:','}, FR=/^fr/i.test(navigator.language||'');
function letter(e){   // la lettre imprimée sur la touche, même quand Alt la transforme
  if(e.key.length===1 && /[a-z]/i.test(e.key)) return e.key.toLowerCase();
  if(LAYOUT[e.code]) return LAYOUT[e.code];
  if(FR && AZERTY[e.code]) return AZERTY[e.code];
  return /^Key[A-Z]$/.test(e.code) ? e.code.slice(3).toLowerCase() : '';
}
function stepBlock(dir){
  const l=(focusD ? towers.filter(t=>t.d===focusD) : towers.slice()).sort((a,b)=>ORDER.indexOf(a.d)-ORDER.indexOf(b.d) || b.size-a.size);
  const i=l.indexOf(selected), t=l[(i<0 ? (dir>0 ? 0 : l.length-1) : i+dir+l.length)%l.length]; closeApp(); run('va '+addr(t));
}
const cycle=(list,curv)=>list[(list.indexOf(curv)+1)%list.length];
const SHORT={
  t:()=>closeApp(), c:()=>openApp('tableur'), p:()=>openApp('piles'), j:()=>openApp('jeu'), i:()=>openApp('irc'), w:()=>openApp('web'), v:()=>openApp('video'), m:()=>openApp('musique'), a:()=>openApp('agents'),
  d:()=>{ closeApp(); run('base'); }, o:()=>{ if(!cur) run('ouvre'); },
  e:()=>{ openMenu(menu.hidden); if(!menu.hidden) menu.querySelector('button').focus(); },
  s:()=>{ const m=cycle(['ambiance','musique','non'], soundOn ? Sound.style : 'non'); if(cur){ applySound(m); if(cur.draw) cur.draw(); } else run('son '+m); },
  x:()=>{ const m=cycle(['calme','auto','intense'], mood.mode); if(cur){ mood.mode=m; setKnobs(); } else run('ambiance '+m); },
  l:()=>stepBlock(1), k:()=>stepBlock(-1)
};
window.addEventListener('keydown', e=>{
  if(!e.altKey && !e.ctrlKey && !e.metaKey && e.key.length===1 && /[a-z]/i.test(e.key)) LAYOUT[e.code]=e.key.toLowerCase();
  if(!entered){
    if(e.target.closest && e.target.closest('button')) return;
    if(e.key==='Enter'){ enter(true); e.preventDefault(); } else if(e.key==='s' || e.key==='S'){ enter(false); e.preventDefault(); }
    return; }
  if(e.altKey && !e.metaKey && !(e.getModifierState && e.getModifierState('AltGraph'))){
    if(/^Digit[0-6]$/.test(e.code) && !e.shiftKey){ closeApp(); const n=+e.code.slice(5); run(n ? 'va '+ORDER[n-1].label : 'va tout'); e.preventDefault(); return; }
    if(/^Arrow/.test(e.code) && !cur){
      if(e.code==='ArrowLeft') goal.th+=.22; else if(e.code==='ArrowRight') goal.th-=.22;
      else goal.r=clamp(goal.r*(e.code==='ArrowUp' ? .84 : 1/.84), 9, 130);
      nudge(.03); e.preventDefault(); return; }
    const f=!e.shiftKey && SHORT[letter(e)]; if(f){ f(); e.preventDefault(); }
    return; }
  if(e.metaKey || e.ctrlKey) return;
  if(!menu.hidden){
    const bs=Array.from(menu.querySelectorAll('button')), i=bs.indexOf(document.activeElement);
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){ bs[(i+1)%bs.length].focus(); e.preventDefault(); }
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ bs[(i+bs.length-1)%bs.length].focus(); e.preventDefault(); }
    else if(e.key==='Escape'){ openMenu(false); if(!cur) q.focus({preventScroll:true}); e.preventDefault(); }
    return; }
  if(cur){
    if(cur.key && cur.key(e)){ e.preventDefault(); return; }
    if(e.key==='Escape'){ closeApp(); e.preventDefault(); }
    return; }
  if(e.target===q) return;
  if(e.key==='Escape'){ if(selected||focusD) run('retour'); return; }
  if(e.target.closest && e.target.closest('button')) return;
  if(e.key.length===1 || e.key==='ArrowUp' || e.key==='Backspace') q.focus({preventScroll:true});
});

const hz=C(0), mid=C(0), v3=new THREE.Vector3();
let last=performance.now()/1000, beatPulse=0, clock=0, loadTick=0;
function onBeat(b){
  if(reduce || mood.I<.3) return;
  beatPulse = b.strong ? 1 : .6;
  const r=rings.find(x=>x.userData.age>1.7); if(!r) return;
  r.userData.age=0; r.userData.gain = clamp((mood.I-.3)/.5,0,1)*(b.strong?1:.55);
  r.position.x = selected ? selected.x : focusD ? focusD.col*PITCH : 0; r.position.z = selected ? selected.z : focusD ? focusD.row*PITCH/2 : 0;
  r.material.color.copy(focusD ? P.hues[focusD.hue] : hz); if(!P.night) r.material.color.lerp(P.ink,.35);
  r.visible=true;
}
function frame(){
  requestAnimationFrame(frame);
  const tn=performance.now()/1000, dt=Math.min(.05, tn-last); last=tn; clock+=dt;

  // Ambiance : l’énergie retombe d’elle-même, l’intensité la suit en douceur
  mood.energy *= Math.exp(-dt/7);
  const target = mood.mode==='calme' ? .04 : mood.mode==='intense' ? .94 : clamp(mood.energy,.04,1);
  mood.I += (target-mood.I)*(1-Math.exp(-dt*(target>mood.I ? 1.6 : .55)));
  const I=mood.I;
  Sound.tick(I);
  const tNow=Sound.now();
  while(Sound.beats.length && Sound.beats[0].t<=tNow) onBeat(Sound.beats.shift());
  if(Sound.beats.length>64) Sound.beats.splice(0, Sound.beats.length-8);
  beatPulse *= Math.exp(-dt*5);
  meterTick+=dt; if(meterTick>.12){ meterTick=0; setMeter(I); }

  // Ciel et brume
  hz.copy(P.hzCalm).lerp(P.hzHot, I); mid.copy(P.midCalm).lerp(P.midHot, I);
  sky.material.uniforms.hz.value.copy(hz); sky.material.uniforms.mid.value.copy(mid);
  scene.fog.color.copy(hz); if(P.night) scene.fog.color.lerp(P.ground,.5);
  starMat.opacity = P.night ? .85*(1-.7*I)*(.8+.2*Math.sin(clock*.7)) : 0;

  // Caméra
  if(entered && !reduce && !ptrs.size) goal.th += dt*(.012+.03*I);
  const k=1-Math.exp(-dt*(entered ? 3.6 : 1)), kr=1-Math.exp(-dt*(entered ? 2.2 : 1));
  cam.th+=(goal.th-cam.th)*k; cam.ph+=(goal.ph-cam.ph)*kr; cam.r+=(goal.r-cam.r)*kr;
  cam.x+=(goal.x-cam.x)*k; cam.y+=(goal.y-cam.y)*k; cam.z+=(goal.z-cam.z)*k;
  if(!entered && !reduce) goal.th += dt*.03;
  // Le terminal mange le bas de l’écran : on recentre le décor dans ce qui reste, et on recule un peu
  const offGoal=term.offsetHeight;
  if(Math.abs(offGoal-viewOff)>.5){ viewOff+=(offGoal-viewOff)*(reduce ? 1 : 1-Math.exp(-dt*6)); camera.setViewOffset(W,H,0,viewOff/2,W,H); }
  const sp=Math.sin(cam.ph), rr=cam.r*(1+.9*viewOff/H);
  camera.position.set(cam.x+rr*sp*Math.sin(cam.th), cam.y+rr*Math.cos(cam.ph), cam.z+rr*sp*Math.cos(cam.th));
  camera.lookAt(cam.x, cam.y, cam.z);
  sky.position.copy(camera.position); stars.position.copy(camera.position);

  // Survol
  let h=null;
  if(entered && lastPtr && !lastPtr.touch && !ptrs.size) h=pickAt(lastPtr.x,lastPtr.y);
  if(h!==hovered){ hovered=h; canvas.classList.toggle('pick', !!h);
    if(h){ tag.textContent=h.name; const s=document.createElement('small'); s.textContent = h.locked ? 'fermé' : fmtSize(h.size); tag.appendChild(s); }
    tag.hidden=!h; }

  // Blocs
  const amp = reduce ? 0 : .006+.02*I, rate=.5+2.4*I;
  loadTick+=dt;
  for(let i=0;i<towers.length;i++){
    const t=towers[i], hue=P.hues[t.d.hue];
    let hh=t.h*(1+amp*Math.sin(clock*rate+t.phase));
    if(t.d.kind==='proc'){
      const sp2=reduce ? .15 : .35+1.6*I;
      t.load = clamp(.42+.3*Math.sin(clock*t.f1*sp2*4+t.phase)+.22*Math.sin(clock*t.f2*sp2*9+t.phase*2)+.1*I, .04, 1);
      hh=t.h*(.62+.5*t.load);
    }
    t.col.scale.y=hh; t.beam.position.y=hh;
    let gh=0;
    if(selected && t!==selected){
      const ax=camera.position.x, az=camera.position.z, bx=selected.x-ax, bz=selected.z-az, L=bx*bx+bz*bz;
      const u=((t.x-ax)*bx+(t.z-az)*bz)/L;
      if(u>.02 && u<.97){ const px=ax+bx*u-t.x, pz=az+bz*u-t.z; if(Math.hypot(px,pz) < Math.max(t.w,t.dp)*.5+selected.w*.5+1.4) gh=1; }
    }
    t.ghost += (gh-t.ghost)*(1-Math.exp(-dt*6));
    t.dim += (t.dimGoal*(1-.9*t.ghost)-t.dim)*(1-Math.exp(-dt*7));
    const hot = (t===selected || t===hovered) ? 1 : 0, pulse = reduce ? 0 : beatPulse*clamp((I-.3)/.5,0,1);
    t.body.material.opacity = (P.night ? .93 : 1)*t.dim; t.body.material.depthWrite = t.dim>.6;
    t.body.material.color.setScalar(P.night ? 1+.25*hot+.18*pulse : 1);
    tmp.copy(hue); if(P.night) tmp.lerp(WHITE, .3+.6*hot+.25*pulse); else tmp.lerp(P.ink, .5+.4*hot);
    t.edges.material.color.copy(tmp); t.edges.material.opacity=(P.night ? .95 : .7)*t.dim;
    t.pool.material.opacity = (P.night ? .5+.25*pulse+.2*hot : .2)*t.dim*(t.d.kind==='proc' && P.night ? .6+.8*t.load : 1);
    if(t.arc) t.arc.material.opacity=(t.locked ? .15 : .65)*t.dim;
    if(t.cage){
      const u=t.cage.userData; u.flash*=Math.exp(-dt*4);
      tmp.copy(P.wall); if(u.flash>.01){ tmp2.set(0xff3b5c); tmp.lerp(tmp2, u.flash); }
      t.cage.material.color.copy(tmp);
      let o=(.5+.5*u.flash)*t.dim;
      if(u.melt>=0){ u.melt+=dt/.9; const m=Math.min(1,u.melt); t.cage.scale.y=1-m*m; o*=1-m;
        if(m>=1){ t.g.remove(t.cage); t.cage.geometry.dispose(); t.cage.material.dispose(); t.cage=null; continue; } }
      t.cage.material.opacity=o;
    }
  }

  // Anneau de sélection et ondes
  selRing.visible=!!selected;
  if(selected){ const s=Math.max(selected.w,selected.dp)*.95+.5+(reduce?0:.12*Math.sin(clock*3));
    selRing.scale.set(s,1,s); selRing.position.x=selected.x; selRing.position.z=selected.z;
    selRing.material.color.copy(P.night ? WHITE : P.ink); }
  rings.forEach(r=>{ if(!r.visible) return; const u=r.userData; u.age+=dt; const a=u.age/1.7;
    if(a>=1){ r.visible=false; return; }
    const s=2+62*(1-Math.pow(1-a,2)); r.scale.set(s,1,s); r.material.opacity=(P.night ? .75 : .45)*u.gain*Math.pow(1-a,1.6); });

  // Circulation
  const speed = reduce ? .25 : .35+2.3*I, share=.3+.7*I;
  for(let i=0;i<NP;i++){ const p=flow.p[i]; p.s+=p.v*speed*dt; if(p.s>46) p.s=-46; else if(p.s<-46) p.s=46;
    const y = p.rank<share ? .22 : -50;
    if(p.ln.ax==='x'){ flow.pos[i*3]=p.s; flow.pos[i*3+2]=p.ln.k+p.off; } else { flow.pos[i*3]=p.ln.k+p.off; flow.pos[i*3+2]=p.s; }
    flow.pos[i*3+1]=y; }
  flowGeo.attributes.position.needsUpdate=true;
  flowMat.size=.95+.6*I; flowMat.opacity=P.night ? .95 : .85;

  agentsTick(dt);
  if(!cur) renderer.render(scene, camera);

  if(hovered){ v3.set(hovered.x, hovered.col.scale.y, hovered.z).project(camera);
    tag.style.transform='translate('+((v3.x+1)/2*W).toFixed(1)+'px,'+((1-v3.y)/2*H).toFixed(1)+'px) translate(-50%,-150%)'; }
  for(let i=0;i<tags.length;i++){ const g=tags[i];
    v3.set(g.d.col*PITCH, g.d.top+2.2, g.d.row*PITCH/2).project(camera);
    const sx=(v3.x+1)/2*W, sy=(1-v3.y)/2*H, on=entered && v3.z<1 && g.d!==focusD && sx>-80 && sx<W+80 && sy>-20 && sy<H+20;
    if(on) g.el.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) translate(-50%,-50%)';
    if(g.on!==on){ g.on=on; g.el.hidden=!on; } }
}
boot(); resize(); frame();

})();
</script>
